[project]
name = "autocoder"
version = "1.0.0"

[tool.ruff]
line-length = 120
target-version = "py311"
# Vendored third-party skill scripts (ui-ux-pro-max, MIT), kept as upstream ships them
extend-exclude = [".claude/skills/ui-ux-pro-max/scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # Line length handled separately
    "E402",  # Allow imports after load_dotenv()
    "E712",  # SQLAlchemy requires == True/False syntax
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["^venv/", "^\\.claude/skills/ui-ux-pro-max/scripts/"]
